<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240">
  <defs>
    <style>text { font-family: system-ui, -apple-system, Roboto, sans-serif; }</style>
  </defs>

  <!-- Notification shade background (dark scrim) -->
  <rect width="360" height="240" fill="#1C1B1F" rx="12"/>
  <rect width="360" height="240" fill="none" stroke="#333333" stroke-width="1" rx="12"/>

  <!-- Status bar (dark) -->
  <text x="12" y="20" font-size="11" fill="rgba(255,255,255,0.7)">9:41</text>
  <text x="348" y="20" font-size="10" fill="rgba(255,255,255,0.7)" text-anchor="end">■ ▲ ⬤</text>

  <!-- "通知" header -->
  <text x="16" y="50" font-size="14" font-weight="500" fill="rgba(255,255,255,0.9)">通知</text>

  <!-- Notification card (light surface over dark shade) -->
  <rect x="12" y="62" width="336" height="80" rx="16" fill="#2B2930"/>

  <!-- App icon placeholder (purple circle) -->
  <circle cx="38" cy="102" r="12" fill="#6650A4"/>
  <text x="38" y="107" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle">Q</text>

  <!-- App name (small, secondary) -->
  <text x="58" y="79" font-size="11" fill="rgba(255,255,255,0.6)">QuickSave</text>

  <!-- Notification title -->
  <text x="58" y="100" font-size="14" font-weight="500" fill="rgba(255,255,255,0.9)">QuickSave</text>

  <!-- Notification body -->
  <text x="58" y="120" font-size="13" fill="rgba(255,255,255,0.7)">点击打开应用保存剪切板内容</text>

  <!-- Ongoing indicator (small tag) -->
  <text x="300" y="79" font-size="10" fill="rgba(255,255,255,0.4)" text-anchor="end">常驻</text>

  <!-- Channel / importance annotation -->
  <text x="12" y="170" font-size="11" fill="rgba(255,255,255,0.5)">渠道：quicksave_channel  •  优先级：LOW（不响铃）</text>
  <text x="12" y="188" font-size="11" fill="rgba(255,255,255,0.5)">样式：Ongoing（不可滑除）  •  点击→打开 MainActivity</text>

  <!-- Screen label (annotation) -->
  <text x="180" y="226" font-size="10" fill="rgba(255,255,255,0.35)" text-anchor="middle">常驻通知设计</text>
</svg>
