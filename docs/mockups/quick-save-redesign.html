<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickSave UI redesign mockup</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    body { margin: 0; min-height: 100vh; background: #DCE6E7; color: #102A36; }
    main { max-width: 1440px; margin: 0 auto; padding: 28px; }
    h1 { margin: 0; font-size: 24px; }
    p { margin: 6px 0 22px; color: #45616A; font-size: 14px; }
    img { display: block; width: 100%; height: auto; border-radius: 18px; box-shadow: 0 18px 40px rgba(16,42,54,.14); }
    @media (max-width: 720px) { main { padding: 16px; } h1 { font-size: 20px; } }
  </style>
</head>
<body>
  <main>
    <h1>QuickSave · UI redesign</h1>
    <p>快速归档工作台 / 首页已配置状态 + 设置页</p>
    <img src="quick-save-redesign.svg" alt="QuickSave 首页和设置页 UI mockup">
  </main>
</body>
</html>
