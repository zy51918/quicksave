<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, Roboto, sans-serif; }
      .h { font-size: 14px; font-weight: 600; }
      .b { font-size: 11.5px; }
      .s { font-size: 10px; }
    </style>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#7C8B91"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="#F4F7F7" rx="14"/>
  <rect width="900" height="620" fill="none" stroke="#D8DEDE" stroke-width="1" rx="14"/>

  <text x="30" y="40" class="h" fill="#102A36">两种候选交互形态 —— 取决于控件能否后台写入</text>
  <text x="30" y="60" class="b" fill="#7C8B91">PRD §5.1 待验证项。形态一为首选目标；若系统强制拉起 App，则退化为形态二，功能不受损、仅多一步。</text>

  <!-- ═══════════ 形态一 ═══════════ -->
  <rect x="30" y="84" width="405" height="500" rx="14" fill="#FFFFFF" stroke="#465511" stroke-width="1.6"/>
  <rect x="30" y="84" width="405" height="40" rx="14" fill="#EDF6D0"/>
  <rect x="30" y="110" width="405" height="14" fill="#EDF6D0"/>
  <text x="50" y="110" class="h" fill="#465511">形态一 · 静默保存（首选）</text>
  <text x="415" y="110" class="s" fill="#465511" text-anchor="end">推荐</text>

  <text x="50" y="148" class="b" fill="#45616A">点击控件 → 后台完成写入 → 用户留在原 App</text>

  <!-- flow -->
  <g>
    <rect x="50" y="168" width="365" height="42" rx="9" fill="#F4F7F7" stroke="#D8DEDE"/>
    <text x="66" y="194" class="b" fill="#102A36">① 下拉控制中心，点 QuickSave</text>

    <line x1="232" y1="214" x2="232" y2="234" stroke="#7C8B91" stroke-width="1.3" marker-end="url(#a2)"/>

    <rect x="50" y="238" width="365" height="42" rx="9" fill="#F4F7F7" stroke="#D8DEDE"/>
    <text x="66" y="264" class="b" fill="#102A36">② 控件后台读配置并追加写入</text>

    <line x1="232" y1="284" x2="232" y2="304" stroke="#7C8B91" stroke-width="1.3" marker-end="url(#a2)"/>

    <rect x="50" y="308" width="365" height="42" rx="9" fill="#EDF6D0" stroke="#465511"/>
    <text x="66" y="334" class="b" fill="#465511">③ 控件短暂显示「已保存」，用户仍在原 App</text>
  </g>

  <!-- pros / cons -->
  <line x1="50" y1="372" x2="415" y2="372" stroke="#F0F3F3"/>
  <text x="50" y="396" class="b" fill="#465511" font-weight="600">✓ 体验最接近 Android 悬浮窗</text>
  <text x="50" y="416" class="s" fill="#45616A">触发 2 步，全程不打断当前上下文</text>
  <text x="50" y="434" class="s" fill="#45616A">搜索结果可直接保存，不必离开浏览器</text>

  <text x="50" y="462" class="b" fill="#B94D3D" font-weight="600">✗ 风险</text>
  <text x="50" y="482" class="s" fill="#45616A">反馈弱：只能靠控件态与 L3 待办提示</text>
  <text x="50" y="500" class="s" fill="#45616A">依赖未验证的「控件可后台写文件」前提</text>

  <!-- mock -->
  <rect x="50" y="522" width="365" height="44" rx="9" fill="#2A2E33"/>
  <text x="66" y="549" class="s" fill="#9AA4AB">原 App 画面保持不动 —— 无任何浮层</text>
  <rect x="330" y="530" width="28" height="28" rx="7" fill="#C5E166"/>
  <path d="M337 541 h14" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

  <!-- ═══════════ 形态二 ═══════════ -->
  <rect x="465" y="84" width="405" height="500" rx="14" fill="#FFFFFF" stroke="#45616A" stroke-width="1.4"/>
  <rect x="465" y="84" width="405" height="40" rx="14" fill="#EEF2F3"/>
  <rect x="465" y="110" width="405" height="14" fill="#EEF2F3"/>
  <text x="485" y="110" class="h" fill="#45616A">形态二 · 打开 App 保存</text>
  <text x="850" y="110" class="s" fill="#7C8B91" text-anchor="end">降级</text>

  <text x="485" y="148" class="b" fill="#45616A">点击控件 → 拉起 QuickSave → 自动保存并反馈</text>

  <g>
    <rect x="485" y="168" width="365" height="42" rx="9" fill="#F4F7F7" stroke="#D8DEDE"/>
    <text x="501" y="194" class="b" fill="#102A36">① 下拉控制中心，点 QuickSave</text>

    <line x1="667" y1="214" x2="667" y2="234" stroke="#7C8B91" stroke-width="1.3" marker-end="url(#a2)"/>

    <rect x="485" y="238" width="365" height="42" rx="9" fill="#F4F7F7" stroke="#D8DEDE"/>
    <text x="501" y="264" class="b" fill="#102A36">② 系统拉起 QuickSave（不留用户操作）</text>

    <line x1="667" y1="284" x2="667" y2="304" stroke="#7C8B91" stroke-width="1.3" marker-end="url(#a2)"/>

    <rect x="485" y="308" width="365" height="42" rx="9" fill="#EEF2F3" stroke="#45616A"/>
    <text x="501" y="334" class="b" fill="#45616A">③ 自动保存 → 底部 Toast「已保存」</text>
  </g>

  <line x1="485" y1="372" x2="850" y2="372" stroke="#F0F3F3"/>
  <text x="485" y="396" class="b" fill="#465511" font-weight="600">✓ 优点</text>
  <text x="485" y="416" class="s" fill="#45616A">反馈明确：复用 QuickSaveToast（L2）</text>
  <text x="485" y="434" class="s" fill="#45616A">不依赖后台写入能力，实现确定</text>

  <text x="485" y="462" class="b" fill="#B94D3D" font-weight="600">✗ 代价</text>
  <text x="485" y="482" class="s" fill="#45616A">打断当前上下文：用户被带离原 App</text>
  <text x="485" y="500" class="s" fill="#45616A">保存后需用户自己按回原 App</text>

  <rect x="485" y="522" width="365" height="44" rx="9" fill="#FFFFFF" stroke="#D8DEDE"/>
  <text x="501" y="549" class="s" fill="#7C8B91">QuickSave 主页短暂出现，底部墨色 Toast</text>
  <rect x="770" y="534" width="64" height="20" rx="10" fill="#102A36" opacity="0.9"/>
  <text x="802" y="548" class="s" fill="#FFFFFF" text-anchor="middle">已保存</text>
</svg>