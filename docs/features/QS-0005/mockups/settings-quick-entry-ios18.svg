<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 600" width="360" height="600">
  <defs>
    <style>text { font-family: system-ui, -apple-system, Roboto, sans-serif; }</style>
  </defs>

  <!-- Screen background (quickSavePaper) -->
  <rect width="360" height="600" fill="#F4F7F7" rx="12"/>
  <rect width="360" height="600" fill="none" stroke="#D8DEDE" stroke-width="1" rx="12"/>

  <!-- Settings page navigation bar -->
  <rect x="0" y="0" width="360" height="44" fill="#FFFFFF" rx="0"/>
  <path d="M0 0 L360 0 L360 44 L0 44 Z" fill="#FFFFFF"/>
  <text x="16" y="28" font-size="16" fill="#087F7B">‹</text>
  <text x="180" y="28" font-size="15" font-weight="600" fill="#102A36" text-anchor="middle">设置</text>
  <line x1="0" y1="44" x2="360" y2="44" stroke="#E4E9E9" stroke-width="1"/>

  <!-- ── Section: 快捷入口 (NEW) ───────────────────────────── -->
  <text x="20" y="76" font-size="12" font-weight="600" fill="#6B7D82" letter-spacing="0.6">快捷入口</text>
  <text x="20" y="90" font-size="10" fill="#9AA8AC">新增 · 控制中心一键保存</text>

  <!-- Info card -->
  <rect x="16" y="102" width="328" height="216" rx="12" fill="#FFFFFF"/>
  <rect x="16" y="102" width="328" height="216" rx="12" fill="none" stroke="#E4E9E9" stroke-width="1"/>

  <!-- Card: title row with icon -->
  <circle cx="42" cy="132" r="14" fill="#E6F4F3"/>
  <path d="M36 126 h12 v9 h-12 z M36 135 l-2.5 4 h17 L48 135" fill="none" stroke="#087F7B" stroke-width="1.6" stroke-linejoin="round"/>
  <line x1="36" y1="126" x2="48" y2="126" stroke="#087F7B" stroke-width="1.6"/>
  <text x="66" y="137" font-size="15" font-weight="600" fill="#102A36">添加到控制中心</text>

  <!-- Steps -->
  <text x="30" y="168" font-size="12.5" fill="#45616A">下拉控制中心 → 点左上</text>
  <circle cx="176" cy="164" r="8" fill="none" stroke="#9AA8AC" stroke-width="1.2"/>
  <text x="176" y="168" font-size="12" fill="#45616A" text-anchor="middle">+</text>
  <text x="190" y="168" font-size="12.5" fill="#45616A">→ 找到 QuickSave → 添加</text>

  <!-- Value proposition -->
  <line x1="30" y1="188" x2="330" y2="188" stroke="#F0F3F3" stroke-width="1"/>
  <text x="30" y="212" font-size="12.5" fill="#45616A">添加后可一键保存剪切板文字，</text>
  <text x="30" y="232" font-size="12.5" fill="#45616A">无需先打开 App。</text>

  <!-- Mini control-center preview strip -->
  <rect x="30" y="250" width="290" height="50" rx="10" fill="#102A36" opacity="0.06"/>
  <rect x="42" y="258" width="34" height="34" rx="9" fill="#FFFFFF" stroke="#E4E9E9" stroke-width="1"/>
  <path d="M52 266 h14 v10 h-14 z M52 276 l-3 5 h20 l-3-5" fill="none" stroke="#087F7B" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="52" y1="266" x2="66" y2="266" stroke="#087F7B" stroke-width="1.5"/>
  <text x="84" y="275" font-size="11" fill="#45616A">控制中心</text>
  <text x="84" y="289" font-size="10" fill="#9AA8AC">QuickSave · 保存剪切板</text>

  <!-- ── Section: 保存目标文件 (context, collapsed) ─────────── -->
  <text x="20" y="352" font-size="12" font-weight="600" fill="#6B7D82" letter-spacing="0.6">保存目标文件</text>
  <rect x="16" y="364" width="328" height="92" rx="12" fill="#FFFFFF"/>
  <rect x="16" y="364" width="328" height="92" rx="12" fill="none" stroke="#E4E9E9" stroke-width="1"/>
  <text x="30" y="392" font-size="13" fill="#087F7B">✓</text>
  <text x="50" y="392" font-size="13.5" fill="#102A36">已配置目标文件</text>
  <line x1="30" y1="406" x2="330" y2="406" stroke="#F0F3F3" stroke-width="1"/>
  <text x="30" y="430" font-size="13.5" fill="#B94D3D">重新选择文件</text>
  <line x1="30" y1="442" x2="330" y2="442" stroke="#F0F3F3" stroke-width="1"/>

  <!-- ── Section: 分类管理 (context, collapsed) ─────────────── -->
  <text x="20" y="486" font-size="12" font-weight="600" fill="#6B7D82" letter-spacing="0.6">分类管理</text>
  <rect x="16" y="498" width="328" height="66" rx="12" fill="#FFFFFF"/>
  <rect x="16" y="498" width="328" height="66" rx="12" fill="none" stroke="#E4E9E9" stroke-width="1"/>
  <text x="30" y="528" font-size="13.5" fill="#102A36">＋ 新增分类</text>
  <text x="30" y="550" font-size="11" fill="#9AA8AC">长按列表项可拖拽排序</text>

  <text x="180" y="592" font-size="10" fill="#9AA8AC" text-anchor="middle">拟新增区块 · iOS 18+ · 其余区块为已有内容</text>
</svg>