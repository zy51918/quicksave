<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <defs>
    <style>text { font-family: system-ui, -apple-system, Roboto, sans-serif; }</style>
  </defs>

  <!-- Dark control-center backdrop -->
  <rect width="760" height="300" fill="#2A2E33" rx="12"/>

  <!-- Title -->
  <text x="30" y="36" font-size="13" font-weight="600" fill="#E8ECEE">控制中心 · QuickSave 控件五态</text>
  <text x="30" y="54" font-size="11" fill="#9AA4AB">控件位为系统渲染，图标与色值由 App 提供</text>

  <!-- ══ ① 就绪 ══════════════════════════════════════════ -->
  <g transform="translate(30, 84)">
    <rect x="0" y="0" width="128" height="128" rx="28" fill="#3D4449"/>
    <rect x="0" y="0" width="128" height="128" rx="28" fill="none" stroke="#4E565C" stroke-width="1"/>
    <!-- archivebox.fill -->
    <path d="M32 44 h64 v12 h-64 z" fill="#C5E166"/>
    <path d="M36 58 h56 v30 a4 4 0 0 1-4 4 h-48 a4 4 0 0 1-4-4 z" fill="#A0C426"/>
    <!-- label -->
    <text x="64" y="112" font-size="11" fill="#C6CDD2" text-anchor="middle">保存剪切板</text>
  </g>
  <text x="94" y="240" font-size="11.5" font-weight="600" fill="#EDF6D0" text-anchor="middle">① 就绪</text>
  <text x="94" y="258" font-size="10" fill="#8E979D" text-anchor="middle">teal · 可保存</text>

  <!-- ══ ② 未配置 ════════════════════════════════════════ -->
  <g transform="translate(178, 84)">
    <rect x="0" y="0" width="128" height="128" rx="28" fill="#3D4449"/>
    <rect x="0" y="0" width="128" height="128" rx="28" fill="none" stroke="#4E565C" stroke-width="1"/>
    <!-- archivebox outline -->
    <path d="M32 44 h64 v12 h-64 z" fill="none" stroke="#B94D3D" stroke-width="3.2"/>
    <path d="M36 58 h56 v30 a4 4 0 0 1-4 4 h-48 a4 4 0 0 1-4-4 z" fill="none" stroke="#B94D3D" stroke-width="3.2"/>
    <!-- badge -->
    <circle cx="98" cy="40" r="14" fill="#B94D3D"/>
    <text x="98" y="45" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">!</text>
    <text x="64" y="112" font-size="11" fill="#C6CDD2" text-anchor="middle">去设置</text>
  </g>
  <text x="242" y="240" font-size="11.5" font-weight="600" fill="#FFDAD3" text-anchor="middle">② 未配置</text>
  <text x="242" y="258" font-size="10" fill="#8E979D" text-anchor="middle">coral + 角标 · 点击去设置</text>

  <!-- ══ ③ 保存中 ════════════════════════════════════════ -->
  <g transform="translate(326, 84)">
    <rect x="0" y="0" width="128" height="128" rx="28" fill="#3D4449"/>
    <rect x="0" y="0" width="128" height="128" rx="28" fill="none" stroke="#4E565C" stroke-width="1"/>
    <!-- dimmed archivebox -->
    <path d="M32 44 h64 v12 h-64 z" fill="#45616A"/>
    <path d="M36 58 h56 v30 a4 4 0 0 1-4 4 h-48 a4 4 0 0 1-4-4 z" fill="#45616A"/>
    <!-- spinner arc -->
    <circle cx="64" cy="84" r="30" fill="none" stroke="#6B7D82" stroke-width="3" opacity="0.4"/>
    <path d="M64 54 a30 30 0 0 1 30 30" fill="none" stroke="#EDF6D0" stroke-width="3.5" stroke-linecap="round"/>
    <text x="64" y="112" font-size="11" fill="#C6CDD2" text-anchor="middle">保存中</text>
  </g>
  <text x="390" y="240" font-size="11.5" font-weight="600" fill="#C6CDD2" text-anchor="middle">③ 保存中</text>
  <text x="390" y="258" font-size="10" fill="#8E979D" text-anchor="middle">inkSoft · 忽略重复点击</text>

  <!-- ══ ④ 刚成功 ════════════════════════════════════════ -->
  <g transform="translate(474, 84)">
    <rect x="0" y="0" width="128" height="128" rx="28" fill="#465511"/>
    <rect x="0" y="0" width="128" height="128" rx="28" fill="none" stroke="#C5E166" stroke-width="1.5"/>
    <circle cx="64" cy="70" r="26" fill="#C5E166"/>
    <path d="M53 70 l8 8 l15 -16" fill="none" stroke="#2D370B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="116" font-size="11" fill="#EDF6D0" text-anchor="middle">已保存</text>
  </g>
  <text x="538" y="240" font-size="11.5" font-weight="600" fill="#EDF6D0" text-anchor="middle">④ 刚成功</text>
  <text x="538" y="258" font-size="10" fill="#8E979D" text-anchor="middle">约 2s 回落就绪</text>

  <!-- ══ ⑤ 刚失败 ════════════════════════════════════════ -->
  <g transform="translate(622, 84)">
    <rect x="0" y="0" width="128" height="128" rx="28" fill="#4B3733"/>
    <rect x="0" y="0" width="128" height="128" rx="28" fill="none" stroke="#B94D3D" stroke-width="1.5"/>
    <circle cx="64" cy="70" r="26" fill="#B94D3D"/>
    <path d="M64 58 v16" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="64" cy="82" r="2.8" fill="#FFFFFF"/>
    <text x="64" y="116" font-size="11" fill="#FFDAD3" text-anchor="middle">未保存</text>
  </g>
  <text x="686" y="240" font-size="11.5" font-weight="600" fill="#FFDAD3" text-anchor="middle">⑤ 刚失败</text>
  <text x="686" y="258" font-size="10" fill="#8E979D" text-anchor="middle">约 3.5s 回落 · 可重试</text>
</svg>