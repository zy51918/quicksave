<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" width="360" height="380">
  <defs>
    <style>text { font-family: system-ui, -apple-system, Roboto, sans-serif; }</style>
  </defs>

  <!-- Screen background (Surface) -->
  <rect width="360" height="380" fill="#FFFBFE" rx="12"/>
  <rect width="360" height="380" fill="none" stroke="#E0E0E0" stroke-width="1" rx="12"/>

  <!-- Status bar -->
  <text x="12" y="17" font-size="11" fill="#49454F">9:41</text>
  <text x="348" y="17" font-size="10" fill="#49454F" text-anchor="end">■ ▲ ⬤</text>

  <!-- Title: QuickSave (headlineMedium 28sp/500) -->
  <text x="16" y="67" font-size="28" font-weight="500" fill="#1C1B1F">QuickSave</text>

  <!-- Settings OutlinedButton (right-aligned, Primary, capsule) -->
  <rect x="272" y="88" width="72" height="36" rx="18" fill="none" stroke="#6650A4" stroke-width="1.5"/>
  <text x="308" y="111" font-size="14" font-weight="500" fill="#6650A4" text-anchor="middle">设置</text>

  <!-- Clipboard content card (PrimaryContainer) -->
  <rect x="16" y="132" width="328" height="142" rx="12" fill="#EADDFF"/>

  <!-- Card label: 当前剪切板 (labelSmall 11sp/500, OnSurfaceVariant) -->
  <text x="28" y="153" font-size="11" font-weight="500" fill="#49454F">当前剪切板</text>

  <!-- Content preview text (bodyMedium 14sp, OnPrimaryContainer, max 3 lines) -->
  <text x="28" y="175" font-size="14" fill="#21005D">今天看到一篇关于 Android 开发的文章，其中</text>
  <text x="28" y="195" font-size="14" fill="#21005D">提到了 Jetpack Compose 的最新特性，包括新</text>
  <text x="28" y="215" font-size="14" fill="#21005D">的动画 API 和更好的状态管理方式…</text>

  <!-- Save button (FilledButton, Primary, right-aligned) -->
  <rect x="212" y="227" width="120" height="36" rx="18" fill="#6650A4"/>
  <text x="272" y="250" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="middle">保存到文件 ▶</text>

  <!-- Clear file button (OutlinedButton, Error color, full width) -->
  <rect x="16" y="286" width="328" height="40" rx="20" fill="none" stroke="#B3261E" stroke-width="1.5"/>
  <text x="180" y="311" font-size="14" font-weight="500" fill="#B3261E" text-anchor="middle">清空保存文件内容</text>

  <!-- State label (design annotation) -->
  <text x="180" y="365" font-size="10" fill="#79747E" text-anchor="middle">主页 — 正常状态（有剪切板内容 + 已配置文件）</text>
</svg>
